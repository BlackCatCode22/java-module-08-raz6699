<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
        }

        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .transition-all {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <header class="mb-10 text-center">
        <h1 class="text-4xl font-bold text-indigo-700 mb-2">User Management System</h1>
        <p class="text-gray-600">Full-stack CRUD application with external API integration</p>
    </header>

    <!-- Main Content -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Left Column - User Form -->
        <div class="lg:col-span-1 bg-white rounded-xl shadow-md p-6 h-fit sticky top-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6">
                <i class="fas fa-user-plus mr-2 text-indigo-500"></i>
                Add New User
            </h2>

            <form id="userForm" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="name" name="name" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                </div>

                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                    <input type="tel" id="phone" name="phone"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                </div>

                <div>
                    <label for="avatar" class="block text-sm font-medium text-gray-700 mb-1">Avatar URL</label>
                    <input type="url" id="avatar" name="avatar"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                </div>

                <input type="hidden" id="userId">

                <div class="flex space-x-3 pt-2">
                    <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                        <i class="fas fa-save mr-2"></i> Save User
                    </button>
                    <button type="button" id="cancelBtn" class="flex-1 bg-gray-200 text-gray-800 py-2 px-4 rounded-lg hover:bg-gray-300 transition-all focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 hidden">
                        <i class="fas fa-times mr-2"></i> Cancel
                    </button>
                </div>
            </form>

            <div class="mt-8">
                <h2 class="text-2xl font-semibold text-gray-800 mb-6">
                    <i class="fas fa-globe mr-2 text-indigo-500"></i>
                    External Data
                </h2>

                <button id="fetchDataBtn" class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition-all focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                    <i class="fas fa-download mr-2"></i> Fetch Random Users
                </button>

                <div id="externalDataContainer" class="mt-4 space-y-4 hidden">
                    <h3 class="text-lg font-medium text-gray-800">Random Users</h3>
                    <div id="externalDataList" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <!-- Right Column - User List -->
        <div class="lg:col-span-2">
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-semibold text-gray-800">
                        <i class="fas fa-users mr-2 text-indigo-500"></i>
                        User Directory
                    </h2>
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search users..."
                               class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all pl-10">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    </div>
                </div>

                <div id="userList" class="space-y-4">
                    <!-- Users will be loaded here -->
                    <div class="text-center py-10">
                        <i class="fas fa-users-slash text-4xl text-gray-300 mb-3"></i>
                        <p class="text-gray-500">No users found. Add some users to get started!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div id="confirmationModal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
    <div class="modal-overlay absolute inset-0 bg-black opacity-50"></div>
    <div class="bg-white rounded-xl shadow-xl z-10 w-full max-w-md mx-4 fade-in">
        <div class="p-6">
            <h3 class="text-xl font-semibold text-gray-800 mb-4" id="modalTitle">Confirm Deletion</h3>
            <p class="text-gray-600 mb-6" id="modalMessage">Are you sure you want to delete this user? This action cannot be undone.</p>
            <div class="flex justify-end space-x-3">
                <button id="modalCancelBtn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition-all">
                    Cancel
                </button>
                <button id="modalConfirmBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-all">
                    Delete
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // DOM Elements
    const userForm = document.getElementById('userForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const avatarInput = document.getElementById('avatar');
    const userIdInput = document.getElementById('userId');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const userList = document.getElementById('userList');
    const searchInput = document.getElementById('searchInput');
    const fetchDataBtn = document.getElementById('fetchDataBtn');
    const externalDataContainer = document.getElementById('externalDataContainer');
    const externalDataList = document.getElementById('externalDataList');
    const confirmationModal = document.getElementById('confirmationModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const modalCancelBtn = document.getElementById('modalCancelBtn');
    const modalConfirmBtn = document.getElementById('modalConfirmBtn');

    // State
    let users = [];
    let isEditing = false;
    let currentUserId = null;
    let userToDelete = null;

    // Initialize the app
    document.addEventListener('DOMContentLoaded', () => {
        loadUsers();
        setupEventListeners();
    });

    // Event Listeners
    function setupEventListeners() {
        userForm.addEventListener('submit', handleFormSubmit);
        cancelBtn.addEventListener('click', cancelEdit);
        searchInput.addEventListener('input', filterUsers);
        fetchDataBtn.addEventListener('click', fetchRandomUsers);
        modalCancelBtn.addEventListener('click', closeModal);
        modalConfirmBtn.addEventListener('click', confirmDelete);
    }

    // Form Submission
    async function handleFormSubmit(e) {
        e.preventDefault();

        const user = {
            name: nameInput.value.trim(),
            email: emailInput.value.trim(),
            phone: phoneInput.value.trim(),
            avatar: avatarInput.value.trim() || 'https://i.pravatar.cc/150?img=3'
        };

        if (isEditing) {
            await updateUser(currentUserId, user);
        } else {
            await addUser(user);
        }

        resetForm();
        loadUsers();
    }

    // CRUD Operations
    async function loadUsers() {
        // In a real app, this would fetch from your backend API
        // For this demo, we're using localStorage
        const storedUsers = localStorage.getItem('users');
        users = storedUsers ? JSON.parse(storedUsers) : [];

        renderUsers(users);
    }

    async function addUser(user) {
        // In a real app, this would POST to your backend API
        const newUser = {
            ...user,
            id: Date.now().toString(),
            createdAt: new Date().toISOString()
        };

        users.unshift(newUser);
        localStorage.setItem('users', JSON.stringify(users));

        showNotification('User added successfully!', 'success');
    }

    async function updateUser(id, updatedData) {
        // In a real app, this would PUT to your backend API
        const index = users.findIndex(user => user.id === id);

        if (index !== -1) {
            users[index] = {
                ...users[index],
                ...updatedData,
                updatedAt: new Date().toISOString()
            };

            localStorage.setItem('users', JSON.stringify(users));
            showNotification('User updated successfully!', 'success');
        }
    }

    function editUser(id) {
        const user = users.find(user => user.id === id);

        if (user) {
            isEditing = true;
            currentUserId = id;

            nameInput.value = user.name;
            emailInput.value = user.email;
            phoneInput.value = user.phone || '';
            avatarInput.value = user.avatar || '';
            userIdInput.value = id;

            submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i> Update User';
            cancelBtn.classList.remove('hidden');

            // Scroll to form
            document.querySelector('.lg\\:col-span-1').scrollIntoView({
                behavior: 'smooth'
            });
        }
    }

    function cancelEdit() {
        resetForm();
    }

    function promptDelete(id) {
        const user = users.find(user => user.id === id);

        if (user) {
            userToDelete = id;
            modalTitle.textContent = `Delete ${user.name}?`;
            modalMessage.textContent = `Are you sure you want to delete ${user.name}? This action cannot be undone.`;
            modalConfirmBtn.textContent = 'Delete';
            modalConfirmBtn.className = 'px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-all';

            openModal();
        }
    }

    async function confirmDelete() {
        if (userToDelete) {
            // In a real app, this would DELETE to your backend API
            users = users.filter(user => user.id !== userToDelete);
            localStorage.setItem('users', JSON.stringify(users));

            showNotification('User deleted successfully!', 'success');
            loadUsers();
            closeModal();
            userToDelete = null;
        }
    }

    // External API Integration
    async function fetchRandomUsers() {
        try {
            fetchDataBtn.disabled = true;
            fetchDataBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Fetching...';

            const response = await fetch('https://randomuser.me/api/?results=5');
            const data = await response.json();

            externalDataList.innerHTML = '';

            data.results.forEach(user => {
                const userCard = document.createElement('div');
                userCard.className = 'bg-gray-50 p-4 rounded-lg flex items-center space-x-4';
                userCard.innerHTML = `
                    <img src="${user.picture.thumbnail}" alt="${user.name.first}" class="w-10 h-10 rounded-full">
                    <div>
                        <h4 class="font-medium">${user.name.first} ${user.name.last}</h4>
                        <p class="text-sm text-gray-500">${user.email}</p>
                    </div>
                `;
                externalDataList.appendChild(userCard);
            });

            externalDataContainer.classList.remove('hidden');
            showNotification('Random users fetched successfully!', 'success');
        } catch (error) {
            showNotification('Failed to fetch random users', 'error');
            console.error('Error fetching random users:', error);
        } finally {
            fetchDataBtn.disabled = false;
            fetchDataBtn.innerHTML = '<i class="fas fa-download mr-2"></i> Fetch Random Users';
        }
    }

    // UI Helpers
    function renderUsers(usersToRender) {
        if (usersToRender.length === 0) {
            userList.innerHTML = `
                <div class="text-center py-10">
                    <i class="fas fa-users-slash text-4xl text-gray-300 mb-3"></i>
                    <p class="text-gray-500">No users found. Add some users to get started!</p>
                </div>
            `;
            return;
        }

        userList.innerHTML = '';

        usersToRender.forEach(user => {
            const userCard = document.createElement('div');
            userCard.className = 'bg-white border border-gray-200 rounded-lg p-5 card-hover transition-all';
            userCard.innerHTML = `
                <div class="flex items-start space-x-4">
                    <img src="${user.avatar}" alt="${user.name}" class="w-14 h-14 rounded-full object-cover">
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h3 class="text-lg font-semibold text-gray-800">${user.name}</h3>
                            <span class="text-xs text-gray-500">${formatDate(user.createdAt)}</span>
                        </div>
                        <p class="text-gray-600 mt-1">${user.email}</p>
                        ${user.phone ? `<p class="text-gray-500 text-sm mt-1"><i class="fas fa-phone mr-2"></i>${user.phone}</p>` : ''}
                    </div>
                </div>
                <div class="flex justify-end space-x-2 mt-4">
                    <button class="edit-btn px-3 py-1 bg-blue-100 text-blue-600 rounded-md text-sm hover:bg-blue-200 transition-all" data-id="${user.id}">
                        <i class="fas fa-edit mr-1"></i> Edit
                    </button>
                    <button class="delete-btn px-3 py-1 bg-red-100 text-red-600 rounded-md text-sm hover:bg-red-200 transition-all" data-id="${user.id}">
                        <i class="fas fa-trash mr-1"></i> Delete
                    </button>
                </div>
            `;

            userList.appendChild(userCard);
        });

        // Add event listeners to buttons
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                editUser(e.currentTarget.getAttribute('data-id'));
            });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                promptDelete(e.currentTarget.getAttribute('data-id'));
            });
        });
    }

    function filterUsers() {
        const searchTerm = searchInput.value.toLowerCase();
        const filteredUsers = users.filter(user =>
            user.name.toLowerCase().includes(searchTerm) ||
            user.email.toLowerCase().includes(searchTerm) ||
            (user.phone && user.phone.toLowerCase().includes(searchTerm))
        );

        renderUsers(filteredUsers);
    }

    function resetForm() {
        userForm.reset();
        isEditing = false;
        currentUserId = null;
        submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i> Save User';
        cancelBtn.classList.add('hidden');
    }

    function showNotification(message, type) {
        const notification = document.createElement('div');
        notification.className = `fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white font-medium fade-in ${
            type === 'success' ? 'bg-green-500' : 'bg-red-500'
        }`;
        notification.textContent = message;

        document.body.appendChild(notification);

        setTimeout(() => {
            notification.classList.add('opacity-0', 'transition-all', 'duration-300');
            setTimeout(() => {
                notification.remove();
            }, 300);
        }, 3000);
    }

    function formatDate(dateString) {
        const options = { year: 'numeric', month: 'short', day: 'numeric' };
        return new Date(dateString).toLocaleDateString(undefined, options);
    }

    function openModal() {
        confirmationModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        confirmationModal.classList.add('hidden');
        document.body.style.overflow = 'auto';
        userToDelete = null;
    }
</script>
</body>
</html>
